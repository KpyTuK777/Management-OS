<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Матеріали — Management OS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/operational-workspaces.css"></head>
<body><main class="op-page"><header class="op-header"><div><p>Management OS · Організаційна інформація</p><h1>Матеріали</h1><span>Один матеріал можна використовувати в різних робочих контекстах без копіювання.</span></div><nav><a href="index.html">Організація</a><a href="investigations.html">Розслідування</a><a href="improvements.html">Вдосконалення</a><a href="memory.html">Пам’ять</a></nav></header><section class="op-toolbar"><input id="materialSearch" type="search" placeholder="Знайти матеріал…"><button id="addMaterial" type="button">Додати матеріал</button></section><section class="op-grid" id="materialList"></section></main>
<dialog id="materialDialog"><form id="materialCreateForm"><header><h2>Додати матеріал</h2><button type="button" data-close>×</button></header><label>Назва<input id="materialName" required></label><label>Файл<input id="materialFile" type="file"></label><label>Посилання<input id="materialUrl" type="url" placeholder="https://"></label><label>Текст або опис<textarea id="materialText" rows="5"></textarea></label><fieldset><legend>Хто надав цю інформацію? <small>Не означає, що інформація правдива</small></legend><label>Людина<input id="sourceName"></label><label>Роль на той момент<input id="sourceRole"></label><label>Підрозділ<input id="sourceDepartment"></label><label>Коли<input id="sourceDate" type="datetime-local"></label></fieldset><footer><button type="button" data-close>Скасувати</button><button type="submit">Зберегти</button></footer></form></dialog>
<dialog id="previewDialog"><article><header><h2 id="previewTitle">Матеріал</h2><button type="button" data-close>×</button></header><div id="previewContent"></div><form id="correctionForm"><label>Уточнення або спростування<textarea id="correctionText" rows="2" required></textarea></label><button type="submit">Додати уточнення</button></form></article></dialog>
<script src="js/operating-model-repository.js"></script><script src="js/material-store.js"></script><script src="js/materials.js"></script></body></html>
