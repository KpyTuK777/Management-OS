<!doctype html>
<html lang="uk"><meta charset="utf-8"><title>Department lifecycle regression</title>
<body><pre id="result">RUNNING</pre><iframe id="app" style="width:1200px;height:760px;border:0"></iframe>
<script src="../js/operating-model-repository.js"></script><script>
const result=document.getElementById("result"),frame=document.getElementById("app"),assert=(value,message)=>{if(!value)throw new Error(message);};
const keys=[];for(let index=0;index<localStorage.length;index+=1)keys.push(localStorage.key(index));keys.filter(key=>key?.startsWith("management-os-operating-model-")).forEach(key=>localStorage.removeItem(key));
const repository=new ManagementOSOperatingModel.OperatingModelRepository(new ManagementOSOperatingModel.BrowserPersistenceAdapter());repository.createOrganization("Northstar Home");let model=repository.snapshot(),root=model.elements.find(item=>item.kind==="organization"),sales=repository.createElement({kind:"department",label:"Продажі",parentId:root.id}),b2b=repository.createElement({kind:"department",label:"B2B",parentId:sales.id});
frame.addEventListener("load",async()=>{await new Promise(resolve=>setTimeout(resolve,120));try{const doc=frame.contentDocument;doc.querySelector(`[data-element-id="${b2b.id}"]`).click();doc.querySelector(`[data-edit-department-id="${b2b.id}"]`).click();doc.querySelector("#editDepartmentName").value="B2B Sales";doc.querySelector("#editDepartmentForm").requestSubmit();await new Promise(resolve=>setTimeout(resolve,30));let review=new ManagementOSOperatingModel.OperatingModelRepository(new ManagementOSOperatingModel.BrowserPersistenceAdapter());assert(review.snapshot().elements.find(item=>item.id===b2b.id).label==="B2B Sales","Department rename persists");doc.querySelector(`[data-remove-department-id="${b2b.id}"]`).click();assert(!doc.querySelector("#removeDepartmentConfirm").disabled,"empty Department can be removed");doc.querySelector("#removeDepartmentForm").requestSubmit();await new Promise(resolve=>setTimeout(resolve,30));review=new ManagementOSOperatingModel.OperatingModelRepository(new ManagementOSOperatingModel.BrowserPersistenceAdapter());model=review.snapshot();assert(model.elements.find(item=>item.id===b2b.id).lifecycle==="retired","Department is retired, not erased");assert(model.relationships.some(item=>item.toId===b2b.id&&item.lifecycle==="superseded"),"historical containment is preserved");assert(!doc.querySelector("#organizationMap").textContent.includes("B2B Sales"),"retired Department leaves active map");const blocked=review.createElement({kind:"department",label:"Enterprise",parentId:sales.id});review.createElement({kind:"role",label:"Enterprise Lead",parentId:blocked.id});assert(review.departmentRemovalImpact(blocked.id).roles===1,"dependencies are counted");let denied=false;try{review.retireDepartment(blocked.id);}catch(_){denied=true;}assert(denied,"dependent Department cannot be silently removed");frame.contentWindow.location.reload();await new Promise(resolve=>setTimeout(resolve,160));assert(!frame.contentDocument.querySelector("#organizationMap").textContent.includes("B2B Sales"),"retirement persists after reload");result.textContent="PASS: edit, safe removal, dependency gate, history, and reload persistence";}catch(error){result.textContent=`FAIL: ${error.message}`;}},{once:true});frame.src="../index.html?view=map";setTimeout(()=>{if(result.textContent==="RUNNING")result.textContent="FAIL: timed out";},7000);
</script></body></html>
