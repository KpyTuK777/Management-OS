<!doctype html><html lang="uk"><meta charset="utf-8"><title>Watson Department removal</title><body><pre id="result">RUNNING</pre><iframe id="app"></iframe><script src="../js/operating-model-repository.js"></script><script>
const out=document.querySelector("#result"),frame=document.querySelector("#app"),keys=[];for(let i=0;i<localStorage.length;i+=1)keys.push(localStorage.key(i));keys.filter(key=>key?.startsWith("management-os-operating-model-")).forEach(key=>localStorage.removeItem(key));const seed=new ManagementOSOperatingModel.OperatingModelRepository(new ManagementOSOperatingModel.BrowserPersistenceAdapter());seed.createOrganization("Northstar Home");const root=seed.snapshot().elements.find(item=>item.kind==="organization"),sales=seed.createElement({kind:"department",label:"Продажі",parentId:root.id}),smb=seed.createElement({kind:"department",label:"SMB",parentId:sales.id});frame.addEventListener("load",async()=>{await new Promise(resolve=>setTimeout(resolve,100));try{const doc=frame.contentDocument;doc.querySelector("#mosWatsonInput").value="Видали SMB із Продажів";doc.querySelector("#mosWatsonForm").requestSubmit();await new Promise(resolve=>setTimeout(resolve,60));if(!doc.querySelector("#mosWatsonProposal").textContent.includes("SMB")||!doc.querySelector("[data-watson-confirm]"))throw new Error("proposal missing");doc.querySelector("[data-watson-confirm]").click();await new Promise(resolve=>setTimeout(resolve,50));const review=new ManagementOSOperatingModel.OperatingModelRepository(new ManagementOSOperatingModel.BrowserPersistenceAdapter());if(review.snapshot().elements.find(item=>item.id===smb.id).lifecycle!=="retired")throw new Error("governed retirement missing");out.textContent="PASS: Watson proposes, confirms, and safely retires Department";}catch(error){out.textContent=`FAIL: ${error.message}`;}},{once:true});frame.src="../index.html?view=department";setTimeout(()=>{if(out.textContent==="RUNNING")out.textContent="FAIL: timed out";},5000);
</script></body></html>
