<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Living Organizational Model real-entry journey</title><style>body{font:14px system-ui;margin:0;background:#111;color:#eee}#result{padding:12px;white-space:pre-wrap}iframe{width:100%;height:760px;border:0}</style></head>
<body>
  <pre id="result">RUNNING</pre>
  <iframe id="app" src="../index.html" title="Management OS real application"></iframe>
  <script>
    (function () {
      const output = document.getElementById("result");
      const frame = document.getElementById("app");
      const lines = [];
      const assert = (value, message) => { if (!value) throw new Error(message); lines.push(`PASS ${message}`); };
      const wait = delay => new Promise(resolve => setTimeout(resolve, delay));
      function clearOperatingModel() {
        const keys = [];
        for (let index = 0; index < localStorage.length; index += 1) keys.push(localStorage.key(index));
        keys.filter(key => key && key.startsWith("management-os-operating-model-")).forEach(key => localStorage.removeItem(key));
      }
      function operationalOptionId(doc, label) {
        return Array.from(doc.querySelector("#elementParent").options).find(option => option.textContent === label)?.value || "";
      }
      async function run() {
        clearOperatingModel();
        const investigationSentinel = JSON.stringify({ version: 1, investigations: [{ id: "investigation-preservation-sentinel", title: "Збережене розслідування", createdAt: "2026-08-08T00:00:00.000Z", updatedAt: "2026-08-08T00:00:00.000Z", data: { situation: { summary: "Збережений стан", revisions: [] }, organizationContext: { workspaceId: "another-workspace", elementId: "copied-element-id" }, known: [], unknowns: [], attention: [], evidence: [], hypotheses: [], workingSet: [], timeline: [] } }] });
        localStorage.setItem("management-os-user-investigations-v1", investigationSentinel);
        const firstLoad = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = `../index.html?test=${Date.now()}`;
        await firstLoad;
        const doc = frame.contentDocument;
        assert(!doc.querySelector("#organizationFirstUse").classList.contains("hidden"), "real index shows honest empty first use");
        assert(doc.querySelector("#startPage").classList.contains("hidden"), "Investigation-first page is not the primary entry");
        doc.querySelector("#organizationName").value = "Обрій";
        doc.querySelector("#organizationCreateForm").requestSubmit();
        await wait(40);
        assert(!doc.querySelector("#organizationShell").classList.contains("hidden"), "organization creation enters the living model");
        assert(!doc.querySelector(".lom-workspace").classList.contains("has-inspector"), "Inspector does not consume workspace width before context is selected");
        const firstCreate = doc.querySelector('[data-create-kind="department"]');
        firstCreate.focus();
        const firstCreateFocus = getComputedStyle(firstCreate);
        assert(parseFloat(firstCreateFocus.outlineWidth) <= 2 && firstCreateFocus.boxShadow !== "none", "keyboard focus uses a restrained visible ring without changing component geometry");
        doc.querySelector("#organizationMenuButton").click();
        assert(doc.querySelector("#organizationMenuButton").getAttribute("aria-expanded") === "true", "organization switcher exposes its open state");
        doc.querySelector("#organizationMenuDialog [data-lom-close]").click();
        await wait(20);
        assert(doc.querySelector("#organizationMenuButton").getAttribute("aria-expanded") === "false", "organization switcher clears expanded state after native dialog dismissal");
        doc.querySelector('[data-create-kind="department"]').click();
        doc.querySelector("#elementLabel").value = "Операційний відділ";
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(40);
        assert(doc.querySelectorAll(".lom-node").length === 2, "department appears on the functional map");
        doc.querySelector('[data-create-kind="department"]').click();
        doc.querySelector("#elementLabel").value = "Маркетинг";
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(40);
        for (const departmentName of ["Виробництво", "Закупівлі", "Логістика", "Відділ якості", "Фінанси", "Персонал", "ІТ", "Сервіс", "Розвиток", "Безпека", "Аналітика", "Партнерства", "Юридичний відділ"]) {
          doc.querySelector('[data-create-kind="department"]').click();
          doc.querySelector("#elementLabel").value = departmentName;
          doc.querySelector("#elementCreateForm").requestSubmit();
          await wait(20);
        }
        doc.querySelector('[data-create-kind="department"]').click();
        doc.querySelector("#elementLabel").value = "Корпоративні продажі";
        doc.querySelector("#elementParent").value = operationalOptionId(doc, "Операційний відділ");
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(20);
        const corporateDepartmentId = Array.from(doc.querySelector("#elementParent").options).find(option => option.textContent === "Корпоративні продажі").value;
        doc.querySelector('[data-create-kind="department"]').click();
        doc.querySelector("#elementLabel").value = "Команда ключових клієнтів";
        doc.querySelector("#elementParent").value = corporateDepartmentId;
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(20);
        const teamId = Array.from(doc.querySelector("#elementParent").options).find(option => option.textContent === "Команда ключових клієнтів").value;
        doc.querySelector('[data-create-kind="role"]').click();
        doc.querySelector("#elementLabel").value = "Керівник ключових клієнтів";
        doc.querySelector("#elementParent").value = teamId;
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(30);
        assert(doc.querySelectorAll(".lom-hierarchy-node--organization > .lom-hierarchy-children > .lom-hierarchy-node--department").length === 15, "Structure preserves fifteen sibling departments on one spatial level");
        assert(doc.querySelectorAll(".lom-hierarchy-node--department").length === 17, "Structure recursively renders nested departments");
        assert(!doc.querySelector(".lom-hierarchy-node--role") && doc.body.textContent.includes("Керівник ключових клієнтів"), "organization-scale Structure keeps Role truth in Department composition without rendering a Role node");
        const operationalId = operationalOptionId(doc, "Операційний відділ");
        const marketingId = operationalOptionId(doc, "Маркетинг");
        doc.querySelector(`[data-element-id="${marketingId}"]`).click();
        doc.querySelector('[data-move-id]').click();
        assert(doc.querySelector("#moveElementDialog").open && !Array.from(doc.querySelector("#moveElementParent").options).some(option => option.value === marketingId), "accessible Move excludes self from semantic parents");
        assert(doc.querySelector("#moveElementParent").value === operationalOptionId(doc, "Обрій"), "Move defaults to the current parent so an unchanged submit is a safe no-op");
        doc.querySelector("#moveElementParent").value = operationalId;
        doc.querySelector("#moveElementForm").requestSubmit();
        await wait(30);
        assert(doc.querySelector(`[data-element-id="${operationalId}"]`).closest(".lom-hierarchy-node").querySelector(`[data-element-id="${marketingId}"]`), "accessible structural move immediately rebuilds hierarchy");
        const inspectorFacts = Array.from(doc.querySelectorAll("#organizationInspectorContent dl > div"));
        assert(inspectorFacts.some(fact => fact.querySelector("dt")?.textContent === "Входить до" && fact.querySelector("dd")?.textContent === "Операційний відділ") && !inspectorFacts.some(fact => fact.querySelector("dt")?.textContent === "Активні розслідування"), "Inspector prioritizes the human parent and omits a meaningless zero Investigation metric");
        assert(!JSON.parse(localStorage.getItem(localStorage.getItem("management-os-operating-model-active-v1"))).state.relationships.some(item => item.family === "containment" && item.toId === marketingId && item.fromId !== operationalId && item.lifecycle === "active"), "Structure action updates the single governed containment truth");
        const structureMap = doc.querySelector("#organizationMap");
        assert(structureMap.scrollWidth > structureMap.clientWidth, "large Structure intentionally exceeds the bounded Map viewport");
        structureMap.scrollLeft = 700;
        assert(structureMap.scrollLeft > 0 && doc.documentElement.scrollWidth === doc.documentElement.clientWidth, "Map pans horizontally without application-level overflow");
        const productionId = operationalOptionId(doc, "Виробництво");
        const transfer = { effectAllowed: "", dropEffect: "", setData() {}, getData() { return productionId; } };
        const dragEvent = type => { const event = new Event(type, { bubbles: true, cancelable: true }); Object.defineProperty(event, "dataTransfer", { value: transfer }); return event; };
        doc.querySelector(`[data-element-id="${productionId}"]`).dispatchEvent(dragEvent("dragstart"));
        const marketingTarget = doc.querySelector(`[data-element-id="${marketingId}"]`);
        assert(marketingTarget.classList.contains("is-valid-drop"), "drag exposes only semantic structural destinations");
        marketingTarget.dispatchEvent(dragEvent("dragover"));
        assert(marketingTarget.classList.contains("is-drop-target"), "dragover shows the future structural destination before commit");
        marketingTarget.dispatchEvent(dragEvent("drop"));
        await wait(30);
        assert(doc.querySelector(`[data-element-id="${marketingId}"]`).closest(".lom-hierarchy-node").querySelector(`[data-element-id="${productionId}"]`), "drag inside a scrolled Map immediately rebuilds governed hierarchy");
        assert(!doc.querySelector(`[data-element-id="${teamId}"]`).closest(".lom-hierarchy-node").querySelector(".lom-hierarchy-node--role"), "Department-only topology remains intact after structural movement");
        doc.querySelector("#expandOrganizationMap").click();
        await wait(20);
        const expandedHeight = doc.querySelector("#organizationMap").clientHeight;
        const expandedRailDisplay = getComputedStyle(doc.querySelector(".lom-rail")).display;
        assert(doc.body.classList.contains("lom-map-expanded") && expandedRailDisplay === "none" && expandedHeight > 500, `expanded Map uses the available viewport without a competing rail or Inspector (${expandedHeight}px; rail ${expandedRailDisplay})`);
        doc.dispatchEvent(new KeyboardEvent("keydown", { key: "/", bubbles: true, cancelable: true }));
        assert(doc.activeElement === doc.querySelector("#expandedOrganizationSearch"), "search shortcut focuses the visible expanded-Map search");
        doc.querySelector("#expandedOrganizationSearch").value = "Виробництво";
        doc.querySelector("#expandedOrganizationSearch").dispatchEvent(new Event("input", { bubbles: true }));
        await wait(30);
        assert(doc.querySelector("#organizationMap .lom-node.is-selected")?.textContent.includes("Виробництво"), "search-to-focus remains available in expanded Map");
        const financeId = operationalOptionId(doc, "Фінанси");
        doc.querySelector(`[data-element-id="${financeId}"]`).dispatchEvent(dragEvent("dragstart"));
        doc.querySelector(`[data-element-id="${marketingId}"]`).dispatchEvent(dragEvent("dragover"));
        doc.querySelector(`[data-element-id="${marketingId}"]`).dispatchEvent(dragEvent("drop"));
        await wait(30);
        assert(doc.querySelector(`[data-element-id="${marketingId}"]`).closest(".lom-hierarchy-node").querySelector(`[data-element-id="${financeId}"]`), "semantic drag/drop remains active in expanded Map");
        doc.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await wait(20);
        assert(!doc.body.classList.contains("lom-map-expanded") && doc.activeElement === doc.querySelector("#expandOrganizationMap"), "Escape exits expanded Map and restores focus to its control");
        doc.querySelector("[data-open-relationship]").click();
        assert(doc.querySelector("#relationshipFamilyField").classList.contains("hidden") && doc.querySelector("#relationshipDialogTitle").textContent.includes("кому звітує"), "Structure relationship creation asks one contextual human question instead of exposing the relationship registry");
        doc.querySelector("#relationshipDialog [data-lom-close]").click();
        const structureScroll = doc.querySelector("#organizationMap");
        structureScroll.scrollLeft = Math.min(420, structureScroll.scrollWidth - structureScroll.clientWidth);
        const rememberedStructureLeft = structureScroll.scrollLeft;
        doc.querySelector('[data-lens="flows"]').click();
        doc.querySelector("[data-open-relationship]").click();
        assert(Array.from(doc.querySelector("#relationshipFamily").options).filter(option => !option.disabled).length === 2 && doc.querySelector("#relationshipFromField").textContent.includes("Хто передає"), "Flow creation exposes only information and material transfer intents");
        doc.querySelector("#relationshipFamily").value = "information-flow";
        const operationalOption = Array.from(doc.querySelector("#relationshipFrom").options).find(option => option.textContent.includes("Операційний відділ"));
        const marketingOption = Array.from(doc.querySelector("#relationshipTo").options).find(option => option.textContent.includes("Маркетинг"));
        doc.querySelector("#relationshipFrom").value = operationalOption.value;
        doc.querySelector("#relationshipTo").value = marketingOption.value;
        doc.querySelector("#relationshipLabel").value = "Прогноз попиту";
        doc.querySelector("#relationshipForm").requestSubmit();
        await wait(20);
        doc.querySelector('[data-lens="operations"]').click();
        assert(doc.querySelector(".lom-operating-view h3").textContent.includes("фактично працює") && doc.querySelector(".lom-lens-context").textContent.includes("Фінанси"), "Work lens retains the selected organizational context");
        assert(doc.querySelector(".lom-operation-group--active b").textContent === "0", "Work total excludes Investigations linked to another organization");
        doc.querySelector('[data-lens="flows"]').click();
        assert(doc.querySelector(".lom-operating-view").textContent.includes("Передавання") && doc.querySelector(".lom-lens-context").textContent.includes("Фінанси"), "Flow lens retains orientation around the same selected department");
        doc.querySelector('[data-lens="structure"]').click();
        await wait(30);
        assert(Math.abs(doc.querySelector("#organizationMap").scrollLeft - rememberedStructureLeft) < 3, "Structure viewport returns to its prior position after viewing Work and Flow");
        doc.querySelector('[data-lens="operations"]').click();
        doc.querySelector("[data-open-relationship]").click();
        assert(doc.querySelector("#relationshipLabel").value === "" && Array.from(doc.querySelector("#relationshipTo").options).every(option => !/Організація|Підрозділ|Роль/.test(option.textContent)), "Work dialog resets stale values and offers work endpoints only");
        doc.querySelector("#relationshipDialog [data-lom-close]").click();
        doc.querySelector('[data-lens="flows"]').click();
        frame.style.width = "390px";
        await wait(20);
        assert(doc.querySelector(".lom-flow-row").textContent.includes("Прогноз попиту") && getComputedStyle(doc.querySelector(".lom-flow-row i")).display !== "none", "390 px Flow preserves source, handoff meaning, destination, and directional arrows");
        assert(doc.documentElement.scrollWidth === doc.documentElement.clientWidth, "organization application has no document overflow at 390 px");
        doc.querySelector('[data-lens="structure"]').click();
        await wait(20);
        assert(doc.querySelector("#organizationMap").scrollWidth > doc.querySelector("#organizationMap").clientWidth && doc.documentElement.scrollWidth === doc.documentElement.clientWidth, "390 px exposes a bounded scrollable Map without pretending the full hierarchy fits");
        assert(doc.querySelector('[data-move-id]'), "390 px retains the bounded non-drag Move action");
        doc.querySelector("#expandOrganizationMap").click();
        await wait(20);
        assert(doc.body.classList.contains("lom-map-expanded") && doc.documentElement.scrollWidth === doc.documentElement.clientWidth && doc.querySelector("#expandedOrganizationSearch").offsetWidth > 0, "390 px expanded Map remains bounded and keeps search available");
        doc.querySelector("#expandOrganizationMap").click();
        frame.style.width = "100%";
        doc.querySelector('[data-lom-view="department"]').click();
        assert(doc.querySelectorAll("#departmentSwitcher button").length < 17 && doc.querySelector("#departmentBreadcrumbs").textContent.includes("Обрій"), "Department navigation derives a hierarchical path and limits navigation to the current level");
        Array.from(doc.querySelectorAll("#departmentBreadcrumbs button")).find(button => button.textContent === "Маркетинг").click();
        await wait(20);
        assert(doc.querySelector("#departmentTitle").textContent === "Маркетинг" && doc.querySelector("#departmentBreadcrumbs").textContent.includes("Операційний відділ") && doc.querySelector("#departmentSwitcher").textContent.includes("Корпоративні продажі"), "child transition exposes its parent path and only same-level siblings");
        assert(doc.querySelector("#departmentChildren").textContent.includes("Виробництво") && !doc.querySelector("#departmentSwitcher").textContent.includes("Юридичний відділ"), "third-level children remain inside parent context instead of flattening into top-level siblings");
        assert(doc.querySelectorAll("#departmentWorkbench .lom-workbench-card.is-empty").length >= 3 && doc.querySelector("#departmentWorkbench .lom-workbench-card--primary:not(.is-empty)"), "Department Workbench lightens empty categories and gives populated primary work more weight");
        const processCard = Array.from(doc.querySelectorAll("#departmentWorkbench .lom-workbench-card")).find(card => card.querySelector("h3")?.textContent === "Операційні процеси");
        processCard.querySelector("[data-create-kind='process']").click();
        doc.querySelector("#elementLabel").value = "Планування онлайн-продажів";
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(30);
        const populatedPrimary = Array.from(doc.querySelectorAll("#departmentWorkbench .lom-workbench-card--primary:not(.is-empty)"));
        const primaryText = populatedPrimary.map(card => card.textContent.replace(/\s+/g, " ").trim()).join(" | ");
        assert(populatedPrimary.some(card => card.textContent.includes("Керівник ключових клієнтів")) && populatedPrimary.some(card => card.textContent.includes("Планування онлайн-продажів")), `Department Workbench emphasizes populated Roles and Processes as the working core (${primaryText})`);
        frame.style.width = "390px";
        await wait(20);
        const narrowCards = Array.from(doc.querySelectorAll("#departmentWorkbench .lom-workbench-card"));
        assert(doc.documentElement.scrollWidth === doc.documentElement.clientWidth && narrowCards.every((card, index) => !index || card.getBoundingClientRect().top >= narrowCards[index - 1].getBoundingClientRect().top), "390 px Department Workbench stacks without document overflow");
        const narrowAdd = narrowCards[0].querySelector("[data-create-kind]");
        narrowAdd.focus();
        assert(doc.activeElement === narrowAdd, "compact Department categories keep keyboard-reachable add actions");
        frame.style.width = "100%";
        doc.querySelector('[data-lom-view="map"]').click();
        doc.querySelector('[data-lom-view="process"]').click();
        doc.querySelector('#processView [data-create-kind="process"]').click();
        assert(doc.querySelector(".lom-knowledge-state summary").textContent.includes("Що ми про це знаємо"), "creation frames qualification as organizational knowledge");
        assert(!doc.querySelector(".lom-knowledge-state").open && doc.querySelector("#elementQualification").value === "known", "ordinary creation defaults knowledge and keeps qualification optional");
        doc.querySelector("#elementLabel").value = "Опрацювання звернення";
        doc.querySelector("#processInput").value = "Звернення";
        doc.querySelector("#processOutput").value = "Відповідь";
        doc.querySelector("#processResult").value = "Питання вирішено";
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(40);
        assert(Array.from(doc.querySelectorAll(".lom-process-flow")).some(flow => flow.textContent.includes("Питання вирішено")), "Input Process Output Result is rendered");
        doc.querySelector('[data-lom-view="map"]').click();
        doc.querySelector('[data-lens="operations"]').click();
        assert(doc.querySelector(".lom-operation-groups").textContent.includes("Опрацювання звернення"), "Work view shows governed process inventory independently of relationship rows");
        doc.querySelector('[data-lom-view="role"]').click();
        doc.querySelector('#roleView [data-create-kind="role"]').click();
        doc.querySelector("#elementLabel").value = "Власник процесу";
        doc.querySelector("#elementCreateForm").requestSubmit();
        await wait(40);
        assert(doc.querySelector("#roleTitle").textContent === "Власник процесу", "Role Workbench opens the created people-free role");
        doc.querySelector('#organizationInspectorContent [data-open-relationship]').click();
        doc.querySelector("#relationshipFamily").value = "responsibility";
        const processOption = Array.from(doc.querySelector("#relationshipTo").options).find(option => option.textContent.includes("Опрацювання звернення"));
        doc.querySelector("#relationshipTo").value = processOption.value;
        doc.querySelector("#relationshipForm").requestSubmit();
        await wait(40);
        assert(doc.querySelector("#roleWorkbench").textContent.includes("Опрацювання звернення"), "responsibility relationship projects into Role Workbench");
        const activeKeyBeforeImprovement = localStorage.getItem("management-os-operating-model-active-v1");
        const elementsBeforeImprovement = JSON.stringify(JSON.parse(localStorage.getItem(activeKeyBeforeImprovement)).state.elements);
        doc.querySelector('#organizationInspectorContent [data-improve-id]').click();
        doc.querySelector("#improvementChange").value = "Скоротити одну передачу між етапами";
        doc.querySelector("#improvementForm").requestSubmit();
        await wait(40);
        const activeKeyAfterImprovement = localStorage.getItem("management-os-operating-model-active-v1");
        const stateAfterImprovement = JSON.parse(localStorage.getItem(activeKeyAfterImprovement)).state;
        assert(stateAfterImprovement.improvements.length === 1, "bounded Improvement is saved from the real UI");
        assert(JSON.stringify(stateAfterImprovement.elements) === elementsBeforeImprovement, "Improvement UI keeps proposed state separate from governed current elements");
        const reload = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = `../index.html?reload=${Date.now()}`;
        await reload;
        let reloadDoc = frame.contentDocument;
        assert(reloadDoc.querySelector("#organizationTitle").textContent === "Обрій", "organization persists across real-entry reload");
        assert(reloadDoc.querySelectorAll(".lom-hierarchy-node--department").length === 17, "persisted deep hierarchy recovers into the map");
        reloadDoc.querySelector("#organizationSearch").value = "Команда ключових";
        reloadDoc.querySelector("#organizationSearch").dispatchEvent(new Event("input", { bubbles: true }));
        await wait(50);
        assert(reloadDoc.querySelector("#organizationInspectorTitle").textContent === "Команда ключових клієнтів" && reloadDoc.querySelector("#organizationMap .lom-node.is-selected")?.textContent.includes("Команда ключових клієнтів"), "search focuses a governed nested department in the Map and Inspector");
        reloadDoc.querySelector("#organizationSearch").value = "Юридичний";
        reloadDoc.querySelector("#organizationSearch").dispatchEvent(new Event("input", { bubbles: true }));
        await wait(450);
        assert(reloadDoc.querySelector("#organizationMap").scrollLeft > 0, "search-to-focus navigates across the large Map canvas");
        assert(!reloadDoc.querySelector("#organizationInspectorContent").textContent.includes("Зв’язки"), "Inspector exposes human organizational facts instead of a raw relationship count");
        reloadDoc.querySelector("#closeOrganizationInspector").click();
        assert(!reloadDoc.querySelector(".lom-workspace").classList.contains("has-inspector"), "closing Inspector restores full workspace width");
        assert(localStorage.getItem("management-os-user-investigations-v1") === investigationSentinel, "organization implementation leaves existing Investigation v1 data untouched");
        reloadDoc.querySelector('[data-open-investigations]').click();
        await wait(20);
        assert(!reloadDoc.querySelector("#startPage").classList.contains("hidden") && reloadDoc.querySelector("[data-return-organization]"), "Organization to Investigation keeps an explicit return path");
        reloadDoc.querySelector("#startPage [data-return-organization]").click();
        await wait(20);
        assert(!reloadDoc.querySelector("#organizationApp").classList.contains("hidden") && reloadDoc.querySelector("#organizationTitle").textContent === "Обрій" && reloadDoc.defaultView.history.state?.managementSurface === "organization", "Investigation to Organization returns through history and restores the active organization");
        const historicalLoad = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.src = "../historical-reader.html#workspace";
        await historicalLoad;
        const historicalDoc = frame.contentDocument;
        const organizationReturn = historicalDoc.querySelector('a[aria-label="Повернутися до організації"]');
        assert(organizationReturn, "Historical Reader exposes an explicit return to Organization");
        const organizationReload = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        organizationReturn.click();
        await organizationReload;
        reloadDoc = frame.contentDocument;
        assert(reloadDoc.querySelector("#organizationTitle").textContent === "Обрій", "Historical Reader to Organization restores the active organization context");
        reloadDoc.querySelector('[data-investigate-id]').click();
        await wait(30);
        assert(!reloadDoc.querySelector("#creationDialog").classList.contains("hidden") && reloadDoc.querySelector("#creationDialog").open, "contextual Investigation opens the preserved creation flow");
        reloadDoc.querySelector("#creationDialog [data-modal-close]").click();
        await wait(20);
        assert(sessionStorage.getItem("management-os-pending-organization-context-v1") === null, "cancelled Investigation cannot leak stale organizational context");
        reloadDoc.querySelector('[data-investigate-id]').click();
        await wait(20);
        reloadDoc.querySelector("#creationForm").requestSubmit();
        await wait(40);
        const investigationStore = JSON.parse(localStorage.getItem("management-os-user-investigations-v1"));
        const createdInvestigation = investigationStore.investigations.find(item => item.id !== "investigation-preservation-sentinel");
        assert(createdInvestigation.data.organizationContext?.promoted === false, "Investigation stores traceable non-promoted organizational context");
        assert(createdInvestigation.data.evidence.length === 0 && createdInvestigation.data.workingSet.length === 0 && createdInvestigation.data.hypotheses.length === 0, "inherited context creates no Evidence Working Set or Hypothesis content");
        assert(reloadDoc.documentElement.scrollWidth === reloadDoc.documentElement.clientWidth, "real entry has no document horizontal overflow");
        frame.style.width = "390px";
        await wait(40);
        assert(reloadDoc.documentElement.scrollWidth === reloadDoc.documentElement.clientWidth, "real entry has no document horizontal overflow at 390 px");
        lines.push("PASS no uncaught exception interrupted the real-entry journey");
        output.textContent = `${lines.join("\n")}\nRESULT PASS`;
        document.body.dataset.testResult = "pass";
      }
      frame.addEventListener("load", () => { if (output.textContent === "RUNNING") run().catch(error => { output.textContent = `${lines.join("\n")}\nFAIL ${error.stack || error.message}`; document.body.dataset.testResult = "fail"; }); }, { once: true });
    }());
  </script>
</body>
</html>
