<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Перевірка української версії історичного розбору</title><link rel="icon" href="data:,"></head><body data-test-result="running"><pre id="result">Виконується перевірка</pre><iframe id="app" title="Історичний розбір"></iframe><script>
(async()=>{const result=document.getElementById("result"),frame=document.getElementById("app"),assert=(v,m)=>{if(!v)throw new Error(m)};try{await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error("Перевищено час завантаження")),8000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src="../historical-reader.html#workspace"});const doc=frame.contentDocument,app=frame.contentWindow;for(let i=0;i<80&&!app.HistoricalReaderState?.phases?.length;i++)await new Promise(r=>setTimeout(r,50));assert(app.HistoricalReaderState.phases.length===11,"Зафіксовані фази не завантажено");assert(app.HistoricalReaderState.phases.reduce((n,p)=>n+p.claims.length,0)===48,"Кількість зафіксованих тверджень змінилася");assert(doc.querySelectorAll("#phaseNavigation button").length===11,"Навігація фазами неповна");assert([...doc.querySelectorAll("#phaseNavigation button")].every(button=>button.getAttribute("aria-label").startsWith("Фаза ")),"Підписи доступності фаз не локалізовано");assert(doc.querySelector('.reader-nav').textContent.includes("Робочий простір"),"Основну навігацію не локалізовано");assert(doc.querySelector('a[href="historical-reader.html"]')?.getAttribute("aria-label")==="Історичний розбір","Бічну навігацію не локалізовано");assert(app.HistoricalReaderState.selectedClaim,"Початкове твердження не вибрано");assert(doc.getElementById("evidenceDetail").textContent.includes("Ідентичність джерела"),"Перевірка доказів недоступна");assert([...doc.querySelectorAll("#evidenceDetail a")].some(a=>a.href.startsWith("https://")),"Перехід до публічного джерела недоступний");assert(doc.getElementById("traceabilityDetail").textContent.includes("Статус ретроспективного знання"),"Простежуваність недоступна");const initialPhase=app.HistoricalReaderState.selectedPhase.id;doc.getElementById("nextPhase").click();assert(app.HistoricalReaderState.selectedPhase.id===initialPhase+1,"Перехід до сусідньої фази не працює");assert(doc.querySelector('#phaseNavigation button[aria-current="step"]'),"Поточну фазу не позначено");[...doc.querySelectorAll("#evidenceDetail button")].find(b=>b.textContent.includes("робочого набору")).click();assert(app.HistoricalReaderState.workingSet.length===1,"Додавання до робочого набору не працює");assert(doc.getElementById("workingSetCount").textContent==="1","Лічильник робочого набору неправильний");assert(doc.getElementById("workingSetFeedback").textContent.includes("не змінює статус доказу"),"Пояснення межі робочого набору відсутнє");doc.querySelector(".working-set-remove").click();assert(app.HistoricalReaderState.workingSet.length===0,"Вилучення з робочого набору не працює");assert(doc.body.textContent.includes("Повторне проходження недоступне"),"Межа повторного проходження відсутня");frame.contentWindow.location.hash="#reflection";await new Promise(r=>setTimeout(r,50));assert(!doc.querySelector('[data-panel="reflection"]').hidden,"Перехід до осмислення не працює");assert([...doc.querySelectorAll("#reflectionContainer button")].every(button=>button.disabled),"Межу осмислення послаблено");assert(doc.documentElement.lang==="uk","Основну мову інтерфейсу не встановлено");document.body.dataset.testResult="passed";result.textContent="Перевірка української версії пройдена"}catch(e){document.body.dataset.testResult="failed";result.textContent=e.stack||e.message}})();
</script></body></html>
