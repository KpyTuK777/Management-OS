(async()=>{const result=document.getElementById("result"),frame=document.getElementById("app"),assert=(v,m)=>{if(!v)throw new Error(m)};try{await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error("Load timeout")),8000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src="../historical-reader.html#workspace"});const doc=frame.contentDocument,app=frame.contentWindow;for(let i=0;i<80&&!app.HistoricalReaderState?.phases?.length;i++)await new Promise(r=>setTimeout(r,50));assert(app.HistoricalReaderState.phases.length===11,"Fixed phases not loaded");assert(app.HistoricalReaderState.phases.reduce((n,p)=>n+p.claims.length,0)===48,"Fixed claim ledger count changed");assert(doc.querySelectorAll("#phaseNavigation button").length===11,"Phase navigation incomplete");assert(app.HistoricalReaderState.selectedClaim,"Initial claim focus missing");assert(doc.getElementById("evidenceDetail").textContent.includes("Source identity"),"Evidence inspection unavailable");assert([...doc.querySelectorAll("#evidenceDetail a")].some(a=>a.href.startsWith("https://")),"Public source navigation unavailable");assert(doc.getElementById("traceabilityDetail").textContent.includes("Hindsight status"),"Traceability unavailable");const initialPhase=app.HistoricalReaderState.selectedPhase.id;doc.getElementById("nextPhase").click();assert(app.HistoricalReaderState.selectedPhase.id===initialPhase+1,"Adjacent phase navigation failed");assert(doc.querySelector('#phaseNavigation button[aria-current="step"]'),"Current phase state missing");[...doc.querySelectorAll("#evidenceDetail button")].find(b=>b.textContent.includes("Working Set")).click();assert(app.HistoricalReaderState.workingSet.length===1,"Working Set add failed");assert(doc.getElementById("workingSetCount").textContent==="1","Working Set count failed");assert(doc.getElementById("workingSetFeedback").textContent.includes("does not change Evidence status"),"Working Set boundary feedback missing");doc.querySelector(".working-set-remove").click();assert(app.HistoricalReaderState.workingSet.length===0,"Working Set remove failed");assert(doc.body.textContent.includes("Replay unavailable"),"Replay boundary missing");frame.contentWindow.location.hash="#reflection";await new Promise(r=>setTimeout(r,50));assert(!doc.querySelector('[data-panel="reflection"]').hidden,"Reflection route failed");assert([...doc.querySelectorAll("#reflectionContainer button")].every(button=>button.disabled),"Reflection boundary weakened");document.body.dataset.testResult="passed";result.textContent="Historical Reader experience test passed"}catch(e){document.body.dataset.testResult="failed";result.textContent=e.stack||e.message}})();
</script></body></html>
