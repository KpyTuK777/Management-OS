<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Operating Model Repository browser contracts</title></head>
<body>
  <h1>Operating Model Repository browser contracts</h1>
  <pre id="result">RUNNING</pre>
  <script src="../js/operating-model-repository.js"></script>
  <script>
    (function () {
      const lines = [];
      const assert = (condition, message) => { if (!condition) throw new Error(message); lines.push(`PASS ${message}`); };
      class MemoryStorage {
        constructor() { this.map = new Map(); }
        get length() { return this.map.size; }
        key(index) { return Array.from(this.map.keys())[index] || null; }
        getItem(key) { return this.map.has(key) ? this.map.get(key) : null; }
        setItem(key, value) { this.map.set(String(key), String(value)); }
        removeItem(key) { this.map.delete(key); }
      }
      try {
        const storage = new MemoryStorage();
        const adapter = new ManagementOSOperatingModel.BrowserPersistenceAdapter(storage);
        const repository = new ManagementOSOperatingModel.OperatingModelRepository(adapter);
        assert(repository.snapshot() === null, "empty repository has no fabricated organization");
        repository.initializeOrganization("Тестова організація");
        const initial = repository.snapshot();
        assert(initial.elements.length === 1 && initial.elements[0].kind === "organization", "organization initializes one governed element");
        const department = repository.createElement({ kind: "department", label: "Операції", parentId: initial.elements[0].id });
        const process = repository.createElement({ kind: "process", label: "Обробка запиту", parentId: department.id, details: { input: "Запит", output: "Відповідь", result: "Питання вирішено" } });
        repository.createRelationship({ family: "responsibility", fromId: department.id, toId: process.id, label: "Відповідає" });
        const current = repository.snapshot();
        assert(current.elements.length === 3, "elements retain stable identities");
        assert(current.relationships.some(item => item.family === "containment" && item.toId === department.id), "containment relationship is created atomically");
        assert(current.relationships.some(item => item.family === "responsibility"), "operational relationship is retained");
        assert(repository.query({ term: "обробка" }).elements[0].id === process.id, "search returns governed identity");
        const beforeImprovement = JSON.stringify(current.elements);
        repository.createImprovement({ elementId: process.id, title: "Спростити", proposedChange: "Скоротити одну передачу" });
        assert(JSON.stringify(repository.snapshot().elements) === beforeImprovement, "Improvement proposal does not mutate current governed elements");
        const context = repository.createInvestigationContext(department.id);
        assert(context.promoted === false, "Investigation context is not promoted");
        assert(repository.snapshot().investigations.length === 0, "navigation context is never projected as an Investigation");
        const sibling = repository.createElement({ kind: "department", label: "Комерційний блок", parentId: initial.elements[0].id });
        const moved = repository.moveElement(department.id, sibling.id);
        assert(moved.previousParentId === initial.elements[0].id && repository.snapshot().relationships.some(item => item.family === "containment" && item.lifecycle === "active" && item.fromId === sibling.id && item.toId === department.id), "structural move atomically replaces active containment");
        assert(repository.snapshot().investigations.length === 0, "structural movement cannot create an Investigation");
        let moveCycleRejected = false;
        try { repository.moveElement(sibling.id, department.id); } catch (_) { moveCycleRejected = true; }
        assert(moveCycleRejected, "structural move rejects a containment cycle");
        const reloaded = new ManagementOSOperatingModel.OperatingModelRepository(adapter);
        assert(reloaded.snapshot().elements.some(item => item.id === process.id), "validated active generation reloads");
        const info = reloaded.recoveryInfo();
        assert(info.validatedGenerations >= 2 && info.activeGeneration > 1, "prior validated generation is retained");
        const organizationAId = initial.workspaceId;
        repository.createOrganization("Northstar Home");
        const emptyB = repository.snapshot();
        const organizationBId = emptyB.workspaceId;
        assert(organizationBId !== organizationAId && emptyB.elements.length === 1 && emptyB.relationships.length === 0 && emptyB.investigations.length === 0 && emptyB.improvements.length === 0, "new organization receives an independent genuinely empty state");
        assert(repository.listOrganizations().length === 2 && repository.listOrganizations().filter(item => item.active).length === 1, "repository lists organizations with one active context");
        repository.switchOrganization(organizationAId);
        assert(repository.snapshot().elements.some(item => item.id === process.id), "switching back restores organization A data");
        repository.switchOrganization(organizationBId);
        assert(repository.snapshot().elements.length === 1, "organization B remains isolated from organization A");
        repository.renameOrganization("Northstar Living");
        const lifecycleReload = new ManagementOSOperatingModel.OperatingModelRepository(adapter);
        assert(lifecycleReload.snapshot().workspaceId === organizationBId && lifecycleReload.snapshot().elements[0].label === "Northstar Living", "active organization and renamed identity survive reload");
        lifecycleReload.switchOrganization(organizationAId);
        assert(lifecycleReload.snapshot().elements.some(item => item.id === process.id), "rename and reload do not leak across organizations");
        lifecycleReload.switchOrganization(organizationBId);
        const bOrganization = repository.snapshot().elements.find(item => item.kind === "organization");
        const bDepartment = repository.createElement({ kind: "department", label: "B-local", parentId: bOrganization.id });
        const beforeInvalid = JSON.stringify(repository.snapshot());
        let invalidRejected = false;
        try { repository.createRelationship({ family: "dependency", fromId: bDepartment.id, toId: bDepartment.id }); } catch (_) { invalidRejected = true; }
        assert(invalidRejected, "invalid self-relationship is rejected without partial commit");
        let cycleRejected = false;
        try { repository.createRelationship({ family: "containment", fromId: bDepartment.id, toId: bOrganization.id }); } catch (_) { cycleRejected = true; }
        assert(cycleRejected, "containment cycle is rejected without partial commit");
        assert(JSON.stringify(repository.snapshot()) === beforeInvalid, "rejected B-local relationships leave state and generation unchanged");
        const activeKey = storage.getItem("management-os-operating-model-active-v1");
        storage.setItem("management-os-operating-model-active-v1", "malformed-pointer");
        const pointerRecovered = new ManagementOSOperatingModel.OperatingModelRepository(adapter);
        assert(pointerRecovered.snapshot() && pointerRecovered.listOrganizations().length === 2, "malformed active pointer recovers deterministically from valid organizations");
        storage.setItem("management-os-operating-model-active-v1", activeKey);
        const activeGenerationBeforeCorruption = repository.recoveryInfo().activeGeneration;
        storage.setItem(activeKey, `${storage.getItem(activeKey).slice(0, -4)}BROKEN`);
        const recovered = new ManagementOSOperatingModel.OperatingModelRepository(adapter);
        assert(recovered.snapshot()?.workspaceId === organizationBId && recovered.recoveryInfo().activeGeneration < activeGenerationBeforeCorruption, "corrupted newest generation recovers a prior validated generation in the active organization");
        assert(recovered.recoveryInfo().recovered === true, "fallback recovery remains explicitly qualified");
        document.getElementById("result").textContent = `${lines.join("\n")}\nRESULT PASS`;
        document.body.dataset.testResult = "pass";
      } catch (error) {
        document.getElementById("result").textContent = `${lines.join("\n")}\nFAIL ${error.stack || error.message}`;
        document.body.dataset.testResult = "fail";
      }
    }());
  </script>
</body>
</html>
