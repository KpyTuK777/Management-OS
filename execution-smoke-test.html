<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>Investigation entry smoke test</title>
<body>
  <pre id="result">RUNNING</pre>
  <iframe id="app" src="index.html" title="Investigation entry test application" style="position:absolute;left:-10000px;width:390px;height:844px;border:0"></iframe>
  <script>
    const result = document.getElementById("result");
    const frame = document.getElementById("app");
    const key = "management-os-user-investigations-v1";
    localStorage.removeItem(key);
    let stage = 0;
    let savedId = "";
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const fail = error => { result.textContent = `FAIL: ${error.message}`; };

    frame.addEventListener("load", () => {
      try {
        const win = frame.contentWindow;
        const doc = win.document;
        if (stage === 0) {
          assert(!doc.getElementById("startPage").classList.contains("hidden"), "Default entry is not the start page");
          assert(doc.getElementById("workbenchShell").classList.contains("hidden"), "Demo opened automatically");
          assert(doc.documentElement.scrollWidth <= win.innerWidth, `Start page overflows horizontally: ${doc.documentElement.scrollWidth}px > ${win.innerWidth}px`);
          doc.getElementById("startInvestigation").click();
          assert(doc.getElementById("creationDialog").matches(":modal"), "Creation flow is not a modal top-layer dialog");
          assert(doc.activeElement === doc.getElementById("creationTitle"), "Focus did not enter the title field");
          doc.getElementById("creationDialog").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          assert(!doc.getElementById("creationDialog").open, "Escape did not close the creation dialog");
          assert(doc.activeElement === doc.getElementById("startInvestigation"), "Focus did not return to the primary entry action after Escape");
          assert(!localStorage.getItem(key), "Escape created an Investigation");
          doc.getElementById("startInvestigation").click();
          doc.getElementById("creationTitle").value = "Перевірка затримок";
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          doc.querySelector("[data-close-creation]").click();
          assert(!localStorage.getItem(key), "Closing creation flow created an Investigation");
          assert(doc.activeElement === doc.getElementById("startInvestigation"), "Focus did not return after Cancel");
          doc.getElementById("startInvestigation").click();
          doc.getElementById("creationTitle").value = "Перевірка затримок";
          doc.getElementById("creationTitle").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.getElementById("creationDialog").open, "Enter submitted while a required field was empty");
          assert(!localStorage.getItem(key), "Invalid Enter created an Investigation");
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          doc.getElementById("creationTitle").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.querySelectorAll("#knownList .compact-item").length === 0, "New Investigation inherited facts");
          assert(doc.querySelectorAll("#unknownList .compact-item").length === 0, "New Investigation inherited unknowns");
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 0, "New Investigation inherited Evidence");
          assert(doc.querySelectorAll("#hypothesisList .hypothesis-card").length === 0, "New Investigation inherited hypotheses");
          assert(doc.querySelectorAll("#relationshipList .relationship-row").length === 0, "New Investigation inherited Relationships");
          assert(doc.querySelectorAll("#timelineList .timeline-event").length === 0, "New Investigation inherited Timeline events");
          assert(doc.querySelectorAll("#workingSetList .working-set-item").length === 0, "New Investigation inherited Working Set");
          assert(!doc.body.textContent.includes("−18%"), "Demo metrics contaminated new Investigation");
          doc.querySelector("[data-start-material]").click();
          doc.getElementById("materialTitle").value = "Журнал доставки";
          doc.getElementById("materialSource").value = "Операційна команда";
          doc.getElementById("materialSummary").value = "Перший неперевірений матеріал користувача.";
          doc.getElementById("saveMaterial").click();
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 1, "First user material was not added");
          const stored = JSON.parse(localStorage.getItem(key));
          assert(stored.investigations.length === 1, "User Investigation was not persisted");
          assert(stored.investigations[0].data.evidence.length === 1, "First material was not persisted");
          assert(stored.investigations[0].data.known.length === 0, "Stored state contains demo facts");
          savedId = stored.investigations[0].id;
          stage = 1;
          frame.src = "index.html";
        } else if (stage === 1) {
          doc.getElementById("openSaved").click();
          assert(doc.getElementById("openSaved").getAttribute("aria-expanded") === "true", "Saved Investigation list did not expand");
          const savedControl = doc.querySelector(`[data-open-investigation='${savedId}']`);
          assert(savedControl, "Persisted Investigation is absent from the saved list");
          savedControl.click();
          assert(doc.getElementById("startPage").classList.contains("hidden"), "Saved Investigation did not restore");
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 1, "Restored Investigation lost material");
          assert(doc.querySelectorAll("#knownList .compact-item").length === 0, "Restored Investigation gained demo facts");
          stage = 2;
          frame.src = "index.html";
        } else if (stage === 2) {
          const demoLink = doc.querySelector("a[href='index.html?demo=MAT-0247']");
          assert(demoLink, "Demonstration entry action is missing");
          stage = 3;
          demoLink.click();
        } else if (stage === 3) {
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 6, "Explicit demo did not preserve MAT-0247");
          const stored = JSON.parse(localStorage.getItem(key));
          assert(stored.investigations[0].data.evidence.length === 1, "Opening demo contaminated user state");
          stage = 4;
          frame.src = "index.html";
        } else if (stage === 4) {
          const historicalLink = doc.querySelector("a[href='historical-reader.html']");
          assert(historicalLink, "Historical Reader entry action is missing");
          stage = 5;
          historicalLink.click();
        } else {
          assert(win.location.pathname.endsWith("/historical-reader.html"), "Historical Reader action did not navigate to the reader");
          result.textContent = "PASS: start → create empty → add material → open saved → demo separation → Historical Reader";
        }
      } catch (error) { fail(error); }
    });
  </script>
</body>
</html>
