<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>Investigation entry smoke test</title>
<body>
  <pre id="result">RUNNING</pre>
  <iframe id="app" src="index.html" title="Investigation entry test application" style="position:absolute;left:-10000px;width:390px;height:844px;border:0"></iframe>
  <script>
    const result = document.getElementById("result");
    const frame = document.getElementById("app");
    if (new URLSearchParams(location.search).get("viewport") === "desktop") { frame.style.width = "1280px"; frame.style.height = "800px"; }
    const key = "management-os-user-investigations-v1";
    localStorage.removeItem(key);
    let stage = 0;
    let savedId = "";
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const fail = error => { result.textContent = `FAIL: ${error.message}`; };
    const assertModalGeometry = (win, dialog) => {
      const rect = dialog.getBoundingClientRect();
      const viewportWidth = dialog.ownerDocument.documentElement.clientWidth;
      const viewportHeight = dialog.ownerDocument.documentElement.clientHeight;
      assert(Math.abs((rect.left + rect.right) / 2 - viewportWidth / 2) <= 1, `${dialog.id} is not horizontally centered`);
      assert(Math.abs((rect.top + rect.bottom) / 2 - viewportHeight / 2) <= 1, `${dialog.id} is not vertically centered`);
      assert(rect.left >= 20 && rect.right <= viewportWidth - 20, `${dialog.id} violates viewport side margins`);
      assert(rect.top >= 20 && rect.bottom <= viewportHeight - 20, `${dialog.id} violates viewport vertical margins`);
      assert(dialog.scrollWidth <= dialog.clientWidth, `${dialog.id} overflows horizontally`);
    };
    const exerciseModalDismissals = (win, doc, opener, dialogId) => {
      const dialog = doc.getElementById(dialogId);
      const paths = ["close", "cancel", "escape"];
      paths.forEach(path => {
        opener.click();
        assert(dialog.matches(":modal"), `${dialogId} did not open as a modal`);
        assertModalGeometry(win, dialog);
        assert(doc.activeElement === dialog.querySelector("[data-modal-autofocus]"), `${dialogId} did not focus its first field`);
        if (path === "close") dialog.querySelector("header [data-modal-close]").click();
        if (path === "cancel") dialog.querySelector("footer [data-modal-close]").click();
        if (path === "escape") dialog.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
        assert(!dialog.open, `${dialogId} did not close by ${path}`);
        assert(doc.activeElement === opener, `${dialogId} did not restore focus after ${path}`);
        assert(!doc.querySelector("dialog:modal"), `${dialogId} left a stale modal overlay after ${path}`);
      });
    };
    const assertShiftEnterNewline = (win, field, dialog) => {
      const initial = field.value;
      field.setSelectionRange(field.value.length, field.value.length);
      field.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", shiftKey: true, bubbles: true, cancelable: true }));
      assert(field.value === `${initial}\n`, `${dialog.id} Shift+Enter did not insert a newline`);
      assert(dialog.open, `${dialog.id} Shift+Enter submitted accidentally`);
    };

    frame.addEventListener("load", () => {
      try {
        const win = frame.contentWindow;
        const doc = win.document;
        if (stage === 0) {
          assert(!doc.getElementById("startPage").classList.contains("hidden"), "Default entry is not the start page");
          assert(doc.getElementById("workbenchShell").classList.contains("hidden"), "Demo opened automatically");
          assert(!doc.querySelector(".start-intro"), "Start page still contains explanatory intro copy");
          assert(doc.getElementById("startInvestigation").children.length === 0, "Primary action still contains decorative or explanatory children");
          assert(doc.querySelectorAll(".start-option strong").length === 3, "Supporting actions are not represented by three concise labels");
          assert(!doc.querySelector(".start-option span"), "Supporting actions still contain explanatory copy");
          assert(doc.documentElement.scrollWidth <= win.innerWidth, `Start page overflows horizontally: ${doc.documentElement.scrollWidth}px > ${win.innerWidth}px`);
          doc.getElementById("startInvestigation").click();
          assert(doc.getElementById("creationDialog").matches(":modal"), "Creation flow is not a modal top-layer dialog");
          assert(doc.activeElement === doc.getElementById("creationTitle"), "Focus did not enter the title field");
          assertModalGeometry(win, doc.getElementById("creationDialog"));
          doc.getElementById("creationDialog").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          assert(!doc.getElementById("creationDialog").open, "Escape did not close the creation dialog");
          assert(doc.activeElement === doc.getElementById("startInvestigation"), "Focus did not return to the primary entry action after Escape");
          assert(!localStorage.getItem(key), "Escape created an Investigation");
          doc.getElementById("startInvestigation").click();
          doc.getElementById("creationTitle").value = "Перевірка затримок";
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          doc.querySelector("#creationDialog header [data-modal-close]").click();
          assert(!localStorage.getItem(key), "Close action created an Investigation");
          assert(doc.activeElement === doc.getElementById("startInvestigation"), "Focus did not return after Close");
          doc.getElementById("startInvestigation").click();
          doc.getElementById("creationTitle").value = "Перевірка затримок";
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          doc.querySelector("#creationDialog footer [data-modal-close]").click();
          assert(!localStorage.getItem(key), "Cancel created an Investigation");
          assert(doc.activeElement === doc.getElementById("startInvestigation"), "Focus did not return after Cancel");
          doc.getElementById("startInvestigation").click();
          doc.getElementById("creationTitle").value = "Перевірка затримок";
          doc.getElementById("creationTitle").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", isComposing: true, bubbles: true, cancelable: true }));
          assert(doc.getElementById("creationDialog").open, "IME composition Enter submitted accidentally");
          doc.getElementById("creationTitle").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.getElementById("creationDialog").open, "Enter submitted while a required field was empty");
          assert(!localStorage.getItem(key), "Invalid Enter created an Investigation");
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          assertShiftEnterNewline(win, doc.getElementById("creationSituation"), doc.getElementById("creationDialog"));
          doc.getElementById("creationSituation").value = "Замовлення надходять клієнтам пізніше обіцяного строку.";
          doc.getElementById("creationTitle").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.querySelectorAll("#knownList .compact-item").length === 0, "New Investigation inherited facts");
          assert(doc.querySelectorAll("#unknownList .compact-item").length === 0, "New Investigation inherited unknowns");
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 0, "New Investigation inherited Evidence");
          assert(doc.querySelectorAll("#hypothesisList .hypothesis-card").length === 0, "New Investigation inherited hypotheses");
          assert(doc.querySelectorAll("#relationshipList .relationship-row").length === 0, "New Investigation inherited Relationships");
          assert(doc.querySelectorAll("#timelineList .timeline-event").length === 0, "New Investigation inherited Timeline events");
          assert(doc.querySelectorAll("#workingSetList .working-set-item").length === 0, "New Investigation inherited Working Set");
          assert(!doc.body.textContent.includes("−18%"), "Demo metrics contaminated new Investigation");
          assert(doc.getElementById("inspectorTitle").textContent === "Watson", "Watson title is not visible");
          assert(doc.getElementById("inspectorEmpty").textContent.includes("ще не аналізує матеріали"), "Watson unavailable boundary is missing");
          assert(!doc.body.textContent.includes("Інспектор"), "Legacy Inspector language remains visible");
          doc.querySelector("[data-view='evidence']").click();
          const addMaterialButton = doc.getElementById("addMaterial");
          exerciseModalDismissals(win, doc, addMaterialButton, "materialDialog");
          addMaterialButton.click();
          doc.getElementById("materialTitle").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.getElementById("materialDialog").open, "Invalid Material Enter submitted accidentally");
          doc.getElementById("materialTitle").value = "Журнал доставки";
          doc.getElementById("materialSource").value = "Операційна команда";
          doc.getElementById("materialSummary").value = "Перший неперевірений матеріал користувача.";
          assertShiftEnterNewline(win, doc.getElementById("materialSummary"), doc.getElementById("materialDialog"));
          doc.getElementById("materialSummary").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 1, "First user material was not added");
          doc.querySelector("[data-view='reasoning']").click();
          exerciseModalDismissals(win, doc, doc.getElementById("addHypothesis"), "hypothesisDialog");
          assert(doc.querySelectorAll("#hypothesisList .hypothesis-card").length === 0, "Dismissed hypothesis modal changed state");
          doc.getElementById("addHypothesis").click();
          doc.getElementById("hypothesisText").value = "Затримка виникає на етапі передачі.";
          assertShiftEnterNewline(win, doc.getElementById("hypothesisText"), doc.getElementById("hypothesisDialog"));
          doc.getElementById("hypothesisText").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.querySelectorAll("#hypothesisList .hypothesis-card").length === 1, "Valid Hypothesis Enter did not submit");
          doc.querySelector("[data-view='situation']").click();
          exerciseModalDismissals(win, doc, doc.getElementById("editSituation"), "situationDialog");
          assert(doc.getElementById("situationSummary").textContent === "Замовлення надходять клієнтам пізніше обіцяного строку.", "Dismissed situation modal changed state");
          doc.getElementById("editSituation").click();
          doc.getElementById("situationInput").value = "Затримки тривають довше очікуваного.";
          doc.getElementById("situationInput").setAttribute("data-long-form", "");
          doc.getElementById("situationInput").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.getElementById("situationDialog").open, "Long-form Enter submitted accidentally");
          doc.getElementById("situationInput").removeAttribute("data-long-form");
          assertShiftEnterNewline(win, doc.getElementById("situationInput"), doc.getElementById("situationDialog"));
          doc.getElementById("situationInput").dispatchEvent(new win.KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(doc.getElementById("situationSummary").textContent.includes("Затримки тривають довше очікуваного."), "Valid Situation Enter did not submit");
          const stored = JSON.parse(localStorage.getItem(key));
          assert(stored.investigations.length === 1, "User Investigation was not persisted");
          assert(stored.investigations[0].data.evidence.length === 1, "First material was not persisted");
          assert(stored.investigations[0].data.known.length === 0, "Stored state contains demo facts");
          savedId = stored.investigations[0].id;
          stage = 1;
          frame.src = "index.html";
        } else if (stage === 1) {
          doc.getElementById("openSaved").click();
          assert(doc.getElementById("openSaved").getAttribute("aria-expanded") === "true", "Saved Investigation list did not expand");
          const savedControl = doc.querySelector(`[data-open-investigation='${savedId}']`);
          assert(savedControl, "Persisted Investigation is absent from the saved list");
          savedControl.click();
          assert(doc.getElementById("startPage").classList.contains("hidden"), "Saved Investigation did not restore");
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 1, "Restored Investigation lost material");
          assert(doc.querySelectorAll("#knownList .compact-item").length === 0, "Restored Investigation gained demo facts");
          stage = 2;
          frame.src = "index.html";
        } else if (stage === 2) {
          const demoLink = doc.querySelector("a[href='index.html?demo=MAT-0247']");
          assert(demoLink, "Demonstration entry action is missing");
          stage = 3;
          demoLink.click();
        } else if (stage === 3) {
          assert(doc.querySelectorAll("#evidenceList .evidence-card").length === 6, "Explicit demo did not preserve MAT-0247");
          const stored = JSON.parse(localStorage.getItem(key));
          assert(stored.investigations[0].data.evidence.length === 1, "Opening demo contaminated user state");
          stage = 4;
          frame.src = "index.html";
        } else if (stage === 4) {
          const historicalLink = doc.querySelector("a[href='historical-reader.html']");
          assert(historicalLink, "Historical Reader entry action is missing");
          stage = 5;
          historicalLink.click();
        } else {
          assert(win.location.pathname.endsWith("/historical-reader.html"), "Historical Reader action did not navigate to the reader");
          result.textContent = "PASS: start → create empty → add material → open saved → demo separation → Historical Reader";
        }
      } catch (error) { fail(error); }
    });
  </script>
</body>
</html>
